# The Site Configuration for Ring0Ehab (Jekyll + Chirpy theme)
# Replace every value marked with  <<< CHANGE ME  before committing.

theme: jekyll-theme-chirpy

# Language: https://www.w3.org/International/questions/qa-choosing-language-tags#question
lang: en

# Change to your timezone: https://kevinnovak.github.io/Time-Zone-Picker
timezone: Africa/Cairo

# jekyll-seo-tag settings
title: Ring0Ehab # the main title shown in the sidebar
tagline: Offensive Security. Active Directory. Red Teaming. # <<< CHANGE ME (text under the title)

description: >- # used by SEO meta and the Atom feed
  Personal blog of Mohammed Ehab, HTB CPTS certified penetration tester.
  Write-ups, research and notes on Active Directory, web security and red teaming.

# Your site URL, must match your GitHub Pages address (lowercase, no trailing slash)
url: "https://ring0ehab.github.io"

github:
  username: Ring0Ehab

twitter:
  username: Mohammed_Ehab76

social:
  # Name shown as author of posts and in the footer
  name: Mohammed Ehab
  email: # put a personal (non-university) email here, or leave empty to hide the icon
  links:
    # The first element is used as the copyright owner link
    - https://twitter.com/Mohammed_Ehab76
    - https://github.com/Ring0Ehab
    - https://www.linkedin.com/in/mohammed-ehab-694378197/
    - https://profile.hackthebox.com/profile/019ee288-5b66-704f-bc8e-4099e6ba6c0c
    - https://medium.com/@mohammad.ehab7760

# Site verification (optional, leave empty if unused)
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# Web Analytics (optional, leave empty if unused)
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:

# Page views (optional)
pageviews:
  provider:

# Theme mode: light / dark. Leave empty to follow the system setting.
# Set "dark" if you want the dark look from the screenshot by default.
theme_mode: dark

# CDN for images/assets (optional)
cdn:

# Avatar shown in the sidebar. Put your image in /assets/img/ and set the path.
# Recommended: square image. Example: /assets/img/avatar.png
avatar: /assets/img/avatar.png # <<< CHANGE ME (after uploading your picture)

# Default preview image when sharing links on social media
social_preview_image: # <<< optional

# Table of contents in posts
toc: true

comments:
  # Global switch for the post comment system. Keep it empty to disable.
  provider:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: false # Set true to enable comments on posts
      toc: true
      # DO NOT modify the following parameter unless you are confident enough
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # see _plugins/ and _tabs/
    values:
      layout: page
      permalink: /:title/
      dynamic_title: true # hide title in mobile mode

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
